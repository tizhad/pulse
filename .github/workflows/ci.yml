name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  actions: read
  contents: read

jobs:
  main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          filter: tree:0
          fetch-depth: 0

      # This enables task distribution via Nx Cloud
      # Run this command as early as possible, before dependencies are installed
      # Learn more at https://nx.dev/ci/reference/nx-cloud-cli#npx-nxcloud-startcirun
      - run: npx nx start-ci-run --distribute-on="3 linux-medium-js" --stop-agents-after="e2e"

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # No package-lock.json is committed (see 5fda918: a macOS-generated
      # lockfile was missing Linux-native optional deps and broke npm ci
      # on Linux). Cloudflare Pages already relies on npm install for the
      # same reason, so CI matches that instead of restoring the lockfile.
      - run: npm install
      - run: npx playwright install --only-shell

      # Prepend any command with "nx record --" to record its logs to Nx Cloud
      - run: npx nx record -- echo Hello World
      # e2e is run directly via Playwright, not as an Nx target: the
      # @nx/playwright plugin's inferred e2e target needs a committed
      # lockfile to resolve @playwright/test as an external dependency
      # for its project graph node, which this repo intentionally lacks
      # (see the npm install step above). This matches the project's
      # documented local workflow (CLAUDE.md: `npx playwright test`).
      # wealth-mate is a frozen app with known-broken lint/test (a stale
      # scaffold import) that isn't being actively worked on — scoped out
      # so it doesn't block CI on job-mate changes.
      - run: npx nx run-many -t lint test build typecheck -p job-mate
      - run: npx playwright test
      # Nx Cloud recommends fixes for failures to help you get CI green faster. Learn more: https://nx.dev/ci/features/self-healing-ci
      - run: npx nx fix-ci
        if: always()
