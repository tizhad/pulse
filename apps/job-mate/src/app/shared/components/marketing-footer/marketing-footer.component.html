<footer class="mkt-footer">
  <div class="mkt-footer-inner">
    @if (links().length) {
      <nav class="mkt-footer-links" aria-label="Footer navigation">
        @for (link of links(); track link.label) {
          @if (link.routerLink) {
            <a [routerLink]="link.routerLink">{{ link.label }}</a>
          } @else if (link.href) {
            <a [href]="link.href" [target]="link.external ? '_blank' : null" [rel]="link.external ? 'noopener noreferrer' : null">
              {{ link.label }}
            </a>
          }
        }
      </nav>
    }
  </div>
</footer>
